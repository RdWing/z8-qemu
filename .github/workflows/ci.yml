name: Source-only checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-and-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native contract-test dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libglib2.0-dev libjpeg-dev
      - name: Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Source inventory
        run: python tools/audit_source.py
      - name: Synthetic contracts and actual display renderer
        run: python tests/run.py
      - name: Shared-model host tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  macos-desktop:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build native workbench without Nikon inputs
        run: python3 desktop/build.py
      - name: Verify ad-hoc bundle signature
        run: codesign --verify --deep --strict .local/desktop/Z8.app
